name: plan-diario
on:
  schedule:
    - cron: "10 14 * * 1-5"   # 16:10 Madrid en horario de verano
    - cron: "10 15 * * 1-5"   # 16:10 Madrid en horario de invierno (el script ignora la hora que no toca)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - id: gen
        run: python generar_plan.py
      - run: |
          git config user.name "plan-bot"
          git config user.email "plan-bot@users.noreply.github.com"
          git add data.json
          git commit -m "plan $(date -u +%F)" || echo "sin cambios"
          git push
      - name: Enviar informe por email
        if: steps.gen.outputs.generado == 'true'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python enviar_email.py
